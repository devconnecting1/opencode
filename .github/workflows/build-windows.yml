name: Build Windows Binary

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows x64
        run: |
          cd packages/opencode
          bun run script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Package Windows x64
        run: |
          cd packages/opencode/dist
          zip -r opencode-windows-x64.zip opencode-windows-x64/bin/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            OpenCode Windows Build (no IP/token limits)
            
            ## Downloads
            - `opencode-windows-x64.zip` - Windows x64
            
            ## Changes
            - Removed IP-based daily rate limit
            - Removed anonymous token limit per IP
          files: |
            packages/opencode/dist/opencode-windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
